name: Deploy WebAssembly Client

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/Clientes/**'
      - 'src/Paqueteria.Comun/**'
      - '.github/workflows/deploy-web.yml' # Se ejecuta si modificas este propio flujo

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Packages (GHCR)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de imagen a minúsculas
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Compila y sube exclusivamente el cliente Web
      - name: Construir y subir imagen de WebAssembly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Clientes/Paqueteria.WebAssembly/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-wasm:latest

  deploy-wasm:
    needs: build-and-push-wasm
    runs-on: ubuntu-latest
    environment: PROD
    
    steps:
      - name: Actualizar WebAssembly en el VPS de Hetzner vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/paqueteria
            
            echo "${{ secrets.CR_PAT_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar e iniciar solo el contenedor de Nginx con Blazor WebAssembly
            docker compose pull paqueteria-wasm
            docker compose up -d paqueteria-wasm
            
            docker image prune -f
