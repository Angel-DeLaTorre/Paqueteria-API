server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección dinámica genérica para cualquier script principal de _framework con hash
    location ~ ^/_framework/(?<script>blazor\.webassembly|dotnet|dotnet\.native|dotnet\.runtime)\.[a-z0-9]+\.js$ {
        try_files $uri =404;
    }

    location ~ ^/_framework/(?<script>blazor\.webassembly|dotnet)\.js$ {
        try_files /$uri @fallback_framework;
    }

    location @fallback_framework {
        # Busca cualquier archivo que coincida con el nombre base y tenga un hash aleatorio
        rewrite ^/_framework/(.+)\.js$ /_framework/$1.*.js break;
        root /usr/share/nginx/html;
    }

    location /_framework/ {
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.clr$ {
        types { application/octet-stream clr; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|json)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}