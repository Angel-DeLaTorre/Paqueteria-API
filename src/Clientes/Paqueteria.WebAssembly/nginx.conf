server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location ~ ^/_framework/blazor\.webassembly\.[a-z0-9]+\.js$ {
        try_files $uri =404;
    }

    location = /_framework/blazor.webassembly.js {
        rewrite ^/_framework/blazor\.webassembly\.js$ /_framework/blazor.webassembly.w3qd1tpl0e.js break;
    }
    
    location = /_framework/blazor.webassembly.js {
        rewrite ^/_framework/blazor\.webassembly\.js$ /_framework/blazor.webassembly.w3qd1tpl0e.js break;
    }

    location = /_framework/dotnet.js {
        rewrite ^/_framework/dotnet\.js$ /_framework/dotnet.j6ekra2h1a.js break;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.clr$ {
        types { application/octet-stream clr; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|json)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}