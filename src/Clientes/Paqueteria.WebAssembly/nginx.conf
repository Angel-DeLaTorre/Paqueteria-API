server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Habilitar compresión para que Nginx sirva los archivos .br/.gz generados por .NET
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración específica para la carpeta _framework de Blazor WebAssembly
    location /_framework/ {
        # Si se solicita el script genérico sin hash, buscar el archivo real o reescribirlo
        location ~ ^/_framework/blazor\.webassembly\.js$ {
            try_files /_framework/blazor.webassembly.*.js =404;
        }
        try_files $uri $uri/ =404;
    }

    # Tipos MIME explícitos para WebAssembly
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
    }

    location ~* \.clr$ {
        types { application/octet-stream clr; }
        add_header Cache-Control "no-cache";
    }

    # Control de caché para archivos estáticos generales
    location ~* \.(?:ico|css|js|gif|jpe?g|png|json|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}